<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Эксперименты с вайбкодингом</title>
  <style>
    :root { --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #667085; --border: #d8dce3; --accent: #2f8f5b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #12151b; --card: #1b2029; --text: #e8ebf0; --muted: #98a2b3; --border: #2e3542; --accent: #4cc285; }
    }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
    h1 { margin: 0 0 4px; }
    p { color: var(--muted); margin: 0 0 24px; }
    a.card { display: block; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; color: inherit; text-decoration: none; }
    a.card:hover { border-color: var(--accent); }
    a.card strong { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <h1>Эксперименты с вайбкодингом</h1>
  <p>Учусь вайбкодингу, тут будут мои эксперименты</p>
  <a class="card" href="calorie-calculator/">
    <strong>Калькулятор калорий</strong><br>
    Суточная норма калорий, БЖУ и ИМТ по формуле Миффлина — Сан Жеора
  </a>
</main>
</body>
</html>
